name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    paths: ['ESP32C3-PixelArtNet/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ESP32C3-PixelArtNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio esptool
      - name: Build firmware
        run: pio run
      - name: Create merged flashable binary
        run: |
          mkdir -p release
          esptool.py --chip esp32c3 merge_bin -o release/firmware-esp32c3-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 .pio/build/esp32c3/bootloader.bin \
            0x8000 .pio/build/esp32c3/partitions.bin \
            0x10000 .pio/build/esp32c3/firmware.bin
          cp .pio/build/esp32c3/firmware.bin release/firmware.bin
          sha256sum release/* > release/checksums.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: ESP32C3-PixelArtNet/release/*
          if-no-files-found: error
      - name: Stage web flasher pages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p webdeploy
          cp -r ../web/* webdeploy/
          sed -i "s/\"version\": \"\"/\"version\": \"${GITHUB_SHA::7}\"/" webdeploy/manifest.json
          cp release/firmware-esp32c3-full.bin webdeploy/
          cp release/checksums.txt webdeploy/
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ESP32C3-PixelArtNet/webdeploy
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
