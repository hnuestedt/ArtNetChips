name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    paths: ['ESP32C3-PixelArtNet/**']
  workflow_dispatch:

# Verhindert parallele Laeufe auf main: Der Publish-Schritt pusht selbst,
# ein zweiter Lauf wuerde sonst mit einem nicht-fast-forward-Push abbrechen.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ESP32C3-PixelArtNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio esptool
      - name: Build firmware
        run: pio run
      - name: Create merged flashable binary
        run: |
          mkdir -p release
          esptool.py --chip esp32c3 merge_bin -o release/firmware-esp32c3-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 .pio/build/esp32c3/bootloader.bin \
            0x8000 .pio/build/esp32c3/partitions.bin \
            0x10000 .pio/build/esp32c3/firmware.bin
          cp .pio/build/esp32c3/firmware.bin release/firmware.bin
          sha256sum release/firmware.bin release/firmware-esp32c3-full.bin > release/checksums.txt
          cp release/checksums.txt ../docs/checksums.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: ESP32C3-PixelArtNet/release/*
          if-no-files-found: error
      - name: Publish flasher page to /docs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp release/firmware-esp32c3-full.bin ../docs/
          cp release/checksums.txt ../docs/
          cp release/firmware.bin release/firmware-esp32c3-full.bin release/checksums.txt ../release/
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"${GITHUB_SHA::7}\"/" ../docs/manifest.json
          git add ../docs ../release
          git commit -m "Update firmware binaries for ${GITHUB_SHA::7}" || echo "No changes"
          git pull --rebase origin main
          git push
