name: Cleanup old artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only artifacts of the last 3 runs per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "3"
        run: |
          set -eu
          REPO="${GITHUB_REPOSITORY}"
          KEEP_IDS=$(mktemp)

          # Collect the IDs of the newest KEEP runs of each workflow
          for wf in $(gh api "repos/${REPO}/actions/workflows" --jq '.workflows[].id'); do
            gh api "repos/${REPO}/actions/workflows/${wf}/runs?per_page=${KEEP}" \
              --jq '.workflow_runs[].id' >> "$KEEP_IDS" || true
          done
          sort -u "$KEEP_IDS" -o "$KEEP_IDS"
          echo "Keeping artifacts of run IDs: $(tr '\n' ' ' < "$KEEP_IDS")"

          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, (.workflow_run.id // 0)] | @tsv' \
            | while IFS='\t' read -r art_id run_id; do
                if [ "$run_id" != "0" ] && grep -qx "$run_id" "$KEEP_IDS"; then
                  echo "Keeping artifact $art_id (run $run_id)"
                else
                  echo "Deleting artifact $art_id (run $run_id)"
                  gh api -X DELETE "repos/${REPO}/actions/artifacts/${art_id}"
                fi
              done

          echo "Cleanup finished."
