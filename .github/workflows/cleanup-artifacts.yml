name: Cleanup old artifacts

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "Deleting artifacts created before $CUTOFF"
          IDS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".[] | select(.created_at < \"$CUTOFF\") | .id")
          if [ -z "$IDS" ]; then
            echo "No old artifacts found."
          else
            echo "$IDS" | xargs -r -n1 -I{} gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
            echo "Done."
          fi
