; ESP32-C3 Pixel-LED-Streifen mit ArtNet / Statisch / Automatik
[env:esp32c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.flash_size = 4MB

lib_deps =
    fastled/FastLED@3.7.8
    https://github.com/hideakitai/ArtNet.git
    tzapu/WiFiManager@^2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP-IDF 4.4 im C3-SDK definiert SOC_RMT_SUPPORTED nicht, obwohl der C3
    ; 4 RMT-Kanaele hat -> sonst faellt FastLED auf den bit-banging-Treiber zurueck
    -DFASTLED_ESP32_HAS_RMT=1
    ; Arduinos eingebautes neopixelWrite() (RGB-LED auf GPIO8) deaktivieren,
    ; da es mit FastLEDs RMT-Treiber kollidiert
    -DESP32_ARDUINO_NO_RGB_BUILTIN=1
    ; Konsole (Serial) ueber den Hardware-USB-C-Port (USB-Serial-JTAG) des C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
